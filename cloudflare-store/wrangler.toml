name = "irons-pub-bingo-store"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Rebuilds src/generated/store-script.js from docs/apps-script-store.gs before every deploy.
[build]
command = "node build.mjs"

[[durable_objects.bindings]]
name = "BINGO_EVENT"
class_name = "BingoEvent"

# SQLite-backed Durable Objects are the kind the Workers free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BingoEvent"]

# The admin page's password. Set it once with:  npx wrangler secret put ADMIN_TOKEN
